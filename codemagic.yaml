workflows:
  android-apk:
    name: Agrosiv8 Android APK
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project
        script: |
          flutter create --platforms=android .
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
